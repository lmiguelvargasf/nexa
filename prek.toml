minimum_prek_version = "0.4.3"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  # Preserve vendored skill and attribution bytes; validate them against upstream.
  { id = "end-of-file-fixer", exclude = '^\.agents/(skills/|licenses/)' },
  { id = "fix-byte-order-marker", exclude = '^\.agents/(skills/|licenses/)' },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '^\.agents/(skills/|licenses/)' },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = '^\.agents/(skills/|licenses/)' },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "Biome check"
language = "system"
entry = "mise exec -- bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true"
files = "\\.(astro|css|graphql|html|js|jsx|json|jsonc|mjs|cjs|ts|tsx|mts|cts)$"
