name: Skill updates

on:
  schedule:
    # Wednesdays at 14:23 UTC (09:23 America/Guayaquil).
    - cron: "23 14 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-skill-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@v4
        with:
          install_args: node bun task gh prek
      - name: Configure Git authentication
        run: gh auth setup-git
      - name: Prepare, validate, and publish one update PR
        env:
          SKILL_UPDATE_OUTPUT: ${{ runner.temp }}/skill-update-report
        run: mise exec -- bun scripts/skills/update.mjs --publish
      - name: Preserve the report, including failed or pending updates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-update-report
          path: ${{ runner.temp }}/skill-update-report
          if-no-files-found: warn
