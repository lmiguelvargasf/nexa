name: Database

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      smoke:
        description: Verify isolated migration, seed, lint, and pgTAP compatibility
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Supabase validation
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node bun
          cache: true

      - name: Cache Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Hosted runners have no prior database volume. Fresh db start applies
      # migrations and seeds; scripts/database/smoke.mjs verifies this contract.
      - name: Start Supabase database
        run: bunx --no-install supabase db start

      - name: Lint database
        run: bunx --no-install supabase db lint --local --fail-on warning

      - name: Run pgTAP tests
        run: |
          if find supabase/tests -type f \( -name "*.sql" -o -name "*.pg" \) 2>/dev/null | grep -q .; then
            bunx --no-install supabase test db --local supabase/tests
          else
            echo "No Supabase pgTAP tests found; skipping."
          fi

      - name: Stop Supabase
        if: always()
        run: bunx --no-install supabase stop --no-backup || true

      - name: Verify isolated database startup contract
        if: success() && inputs.smoke == true
        run: node scripts/database/smoke.mjs
