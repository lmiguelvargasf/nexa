name: Database

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Supabase validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node bun task
          cache: true

      - name: Cache Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase
        run: task db:start

      - name: Reset database
        run: bunx supabase db reset --local --yes

      - name: Lint database
        run: bunx supabase db lint --local --fail-on warning

      - name: Run pgTAP tests
        run: |
          if find supabase/tests -type f -name "*.sql" 2>/dev/null | grep -q .; then
            bunx supabase test db --local supabase/tests
          else
            echo "No Supabase pgTAP tests found; skipping."
          fi

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup || true
