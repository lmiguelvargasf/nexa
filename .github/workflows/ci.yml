name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      database: ${{ steps.scope.outputs.database }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node
      - name: Determine applicable database checks
        id: scope
        run: node scripts/dependencies/ci.mjs scope
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}

  verify:
    name: Pre-PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node bun task prek
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Verify locked hook tooling and repository hooks
        run: |
          mise install --locked prek
          prek --version
          task hooks:run
          git diff --exit-code HEAD --
      - name: Install browser binaries and system libraries
        run: bunx --no-install playwright install --with-deps
      - name: Run validation and production browser smoke
        run: task verify:all
      - name: Audit dependencies
        run: task dependencies:audit
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  database:
    needs: scope
    if: needs.scope.outputs.database == 'true'
    uses: ./.github/workflows/database.yml

  aggregate:
    name: CI validation
    needs: [scope, verify, database]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node
      - name: Require every applicable check
        run: node scripts/dependencies/ci.mjs aggregate
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          DATABASE_REQUIRED: ${{ needs.scope.outputs.database }}
