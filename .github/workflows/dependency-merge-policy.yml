name: Evaluate dependency merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI, Dependency review]
    # requested does not fire for reruns; refresh the status when they start too.
    types: [completed, requested, in_progress]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to evaluate, or all for a bounded refresh
        required: true
        type: string
      approve:
        description: I reviewed this exact head/base and approve manual completion (CI remains required)
        default: false
        type: boolean
      expected_head:
        description: Exact reviewed PR head SHA (required when approve is true)
        type: string
      expected_base:
        description: Exact reviewed base SHA (required when approve is true)
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  targets:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install_args: node
      - name: Resolve affected PRs from trusted API run metadata
        id: resolve
        run: node scripts/dependencies/merge-policy.mjs "$RUNNER_TEMP/dependency-human-approval"
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ONLY: "true"

  evaluate:
    needs: targets
    if: needs.targets.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    # All events, including base refreshes, share this lock for the same PR.
    # Different PRs progress independently; queued publishers read live state.
    concurrency:
      group: dependency-merge-policy-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never check out PR code or install dependencies with this write token.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install_args: node
      - name: Publish current trusted merge decision
        run: node scripts/dependencies/merge-policy.mjs "$RUNNER_TEMP/dependency-human-approval"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ matrix.pr }}
          AUTOMERGE_ENABLED: ${{ vars.DEPENDENCY_AUTOMERGE_ENABLED }}
      - name: Preserve revision-bound human attestation
        uses: actions/upload-artifact@v7
        with:
          name: dependency-human-approval
          path: ${{ runner.temp }}/dependency-human-approval/approval.json
          if-no-files-found: ignore
          retention-days: 30
