name: Evaluate dependency merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI, Dependency review]
    types: [completed, requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to evaluate
        required: true
        type: string
      approve:
        description: I reviewed this exact head/base and approve manual completion (CI remains required)
        default: false
        type: boolean
      expected_head:
        description: Exact reviewed PR head SHA (required when approve is true)
        type: string
      expected_base:
        description: Exact reviewed base SHA (required when approve is true)
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

# Serialize status publishers. Each queued run reads current API state instead of
# trusting its old event payload. GitHub, rather than this workflow, merges PRs.
concurrency:
  group: dependency-merge-policy
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never check out PR code or install dependencies with this write token.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      # A commit status explicitly targets the PR head. A workflow_run or
      # workflow_dispatch job check alone does not satisfy PR required checks.
      - name: Publish current trusted merge decision
        run: node scripts/dependencies/merge-policy.mjs "$RUNNER_TEMP/dependency-human-approval"
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_ENABLED: ${{ vars.DEPENDENCY_AUTOMERGE_ENABLED }}
      - name: Preserve revision-bound human attestation
        uses: actions/upload-artifact@v7
        with:
          name: dependency-human-approval
          path: ${{ runner.temp }}/dependency-human-approval/approval.json
          if-no-files-found: ignore
          retention-days: 30
