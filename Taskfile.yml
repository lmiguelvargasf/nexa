# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3.17"

vars:
  BUN: mise exec -- bun
  BUN_RUN: mise exec -- bun run
  BUNX: mise exec -- bunx
  GH: mise exec -- gh

dotenv:
  - .env.local

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install pinned tools, dependencies, env file, Playwright browsers, and Git hooks
    cmds:
      - mise install --yes --locked
      - task: env:init
      - task: install
      - task: playwright:install
      - task: hooks:install

  env:init:
    desc: Create .env.local from .env.example when it does not exist
    status:
      - test -f .env.local
    cmds:
      - cp .env.example .env.local

  install:
    desc: Install Bun dependencies
    aliases: [deps]
    cmds:
      - "{{.BUN}} install"

  dev:
    desc: Start local Supabase, then the Next.js development server
    aliases: [up]
    cmds:
      - task: db:start
        vars:
          CLI_ARGS: ""
      - "{{.BUN_RUN}} dev {{.CLI_ARGS}}"

  app:
    desc: Start only the Next.js development server
    cmds:
      - "{{.BUN_RUN}} dev {{.CLI_ARGS}}"

  build:
    desc: Create a production Next.js build
    cmds:
      - "{{.BUN_RUN}} build {{.CLI_ARGS}}"

  start:
    desc: Start the production server after a build
    cmds:
      - "{{.BUN_RUN}} start {{.CLI_ARGS}}"

  typecheck:
    desc: Generate Next route types and run TypeScript checks
    aliases: [types]
    cmds:
      - "{{.BUN_RUN}} typecheck"

  lint:
    desc: Run Biome lint rules
    cmds:
      - "{{.BUN_RUN}} lint {{.CLI_ARGS}}"

  format:
    desc: Format the repository with Biome
    aliases: [fmt]
    cmds:
      - "{{.BUN_RUN}} format {{.CLI_ARGS}}"

  check:
    desc: Run Biome formatting, linting, and import checks
    cmds:
      - "{{.BUN_RUN}} check {{.CLI_ARGS}}"

  check:write:
    desc: Apply safe Biome fixes
    aliases: [fix]
    cmds:
      - "{{.BUN_RUN}} check:write {{.CLI_ARGS}}"

  hooks:install:
    desc: Install prek Git hooks
    cmds:
      - mise exec -- prek install --prepare-hooks {{.CLI_ARGS}}

  hooks:run:
    desc: Run prek hooks against the whole repository
    cmds:
      - mise exec -- prek run --all-files {{.CLI_ARGS}}

  test:
    desc: Run Vitest in watch mode
    cmds:
      - "{{.BUN_RUN}} test {{.CLI_ARGS}}"

  test:run:
    desc: Run Vitest once
    aliases: [unit]
    cmds:
      - "{{.BUN_RUN}} test:run {{.CLI_ARGS}}"

  e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - "{{.BUN_RUN}} e2e {{.CLI_ARGS}}"

  e2e:ui:
    desc: Open the Playwright UI runner
    cmds:
      - "{{.BUN_RUN}} e2e:ui {{.CLI_ARGS}}"

  playwright:install:
    desc: Install Playwright browser binaries
    cmds:
      - "{{.BUNX}} playwright install {{.CLI_ARGS}}"

  audit:
    desc: Run a Bun dependency advisory audit
    cmds:
      - "{{.BUN}} audit {{.CLI_ARGS}}"

  verify:
    desc: Run local pre-PR checks except browser E2E tests
    cmds:
      - task: check
      - task: typecheck
      - task: test:run
      - task: build

  verify:all:
    desc: Run all validation, including browser E2E tests
    aliases: [ci]
    cmds:
      - task: verify
      - task: e2e

  pr:create:
    desc: Create a GitHub pull request with the repository PR template
    cmds:
      - "{{.GH}} pr create --template .github/pull_request_template.md {{.CLI_ARGS}}"

  db:start:
    desc: Start the local Supabase stack
    cmds:
      - "{{.BUN_RUN}} db:start {{.CLI_ARGS}}"
      - mise exec -- ./scripts/sync-supabase-env.sh

  db:stop:
    desc: Stop the local Supabase stack
    cmds:
      - "{{.BUN_RUN}} db:stop {{.CLI_ARGS}}"

  db:reset:
    desc: Reset the local Supabase database
    cmds:
      - "{{.BUN_RUN}} db:reset {{.CLI_ARGS}}"

  db:pull:
    desc: Pull remote schema changes into Supabase migrations
    cmds:
      - "{{.BUN_RUN}} db:pull {{.CLI_ARGS}}"

  db:types:
    desc: Generate local Supabase TypeScript database types
    cmds:
      - "{{.BUN_RUN}} db:types"

  email:dev:
    desc: Start the React Email preview server
    cmds:
      - "{{.BUN_RUN}} email:dev {{.CLI_ARGS}}"

  next:info:
    desc: Print Next.js diagnostic information
    cmds:
      - "{{.BUNX}} next info {{.CLI_ARGS}}"
