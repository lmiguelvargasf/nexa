[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-arm64", "linux-x64"]

[tools]
node = "24.15.0"
bun = "1.3.13"
gh = "2.92.0"

[tasks.deps]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."env:init"]
description = "Create .env.local from .env.example when missing"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -f .env.local ]; then
  echo ".env.local already exists"
else
  cp .env.example .env.local
  echo "Created .env.local from .env.example"
fi
'''

[tasks.setup]
description = "Install dependencies, initialize env, and install Playwright browsers"
depends = ["deps", "env:init"]
run = "bunx playwright install"

[tasks.dev]
description = "Start the Next.js development server"
run = "bun run dev"

[tasks.build]
description = "Create a production build"
run = "bun run build"

[tasks.start]
description = "Start the production server after build"
run = "bun run start"

[tasks.check]
description = "Run Biome checks"
run = "bun run check"

[tasks."check:write"]
description = "Apply safe Biome fixes"
run = "bun run check:write"

[tasks.lint]
description = "Run Biome lint rules"
run = "bun run lint"

[tasks.format]
description = "Format the repository with Biome"
run = "bun run format"

[tasks.typecheck]
description = "Generate Next route types and run TypeScript"
run = "bun run typecheck"

[tasks.test]
description = "Run Vitest once"
run = "bun run test:run"

[tasks."test:watch"]
description = "Run Vitest in watch mode"
run = "bun run test"

[tasks.e2e]
description = "Run Playwright end-to-end tests"
run = "bun run e2e"

[tasks."e2e:ui"]
description = "Open the Playwright UI runner"
run = "bun run e2e:ui"

[tasks.validate]
description = "Run the pre-PR validation suite"
run = [
  "mise run check",
  "mise run typecheck",
  "mise run test",
  "mise run build",
  "mise run e2e",
]

[tasks."db:start"]
description = "Start the local Supabase stack"
run = "bun run db:start"

[tasks."db:stop"]
description = "Stop the local Supabase stack"
run = "bun run db:stop"

[tasks."db:reset"]
description = "Reset the local Supabase database"
run = "bun run db:reset"

[tasks."db:pull"]
description = "Pull remote schema changes into Supabase migrations"
run = "bun run db:pull"

[tasks."db:types"]
description = "Generate local Supabase TypeScript database types"
run = "bun run db:types"

[tasks."db:introspect"]
description = "Introspect the database with Drizzle Kit"
run = "bun run db:introspect"

[tasks."email:dev"]
description = "Start the React Email preview server on port 3001"
run = "bun run email:dev --port 3001"

[tasks.doctor]
description = "Check required local tooling"
run = '''
#!/usr/bin/env bash
set -euo pipefail

node --version
bun --version
gh --version | head -n 1
docker --version

if [ ! -f .env.local ]; then
  echo ".env.local is missing; run: mise run env:init"
fi
'''
